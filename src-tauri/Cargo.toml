[package]
name = "window-pointer-zoom"
version = "0.1.0"
description = "Full-screen pointer-centric desktop zoom utility for Windows"
authors = ["Window Pointer Zoom"]
edition = "2021"

[lib]
name = "window_pointer_zoom_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_UI_Magnification",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
] }
